<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>School Portal</h2>
        </div>
        <ul class="sidebar-nav">
            <li><a href="index.html"><span class="icon">👨‍🎓</span> <span>Students</span></a></li>
            <li><a href="faculty.html"><span class="icon">👨‍🏫</span> <span>Faculty</span></a></li>
            <li><a href="course.html" class="active"><span class="icon">📚</span> <span>Courses</span></a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1>Course Management</h1>

            <div class="form-container">
                <h2 id="form-title">Add New Course</h2>
                <form id="course-form">
                    <input type="hidden" id="course-id">
                    <div class="form-group">
                        <label for="course-code">Course Code</label>
                        <input type="text" id="course-code" name="courseCode" placeholder="e.g. CS101" required>
                    </div>
                    <div class="form-group">
                        <label for="course-name">Course Name</label>
                        <input type="text" id="course-name" name="courseName" placeholder="e.g. Introduction to Programming" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" placeholder="Short course description">
                    </div>
                    <div class="form-group">
                        <label for="credits">Credits</label>
                        <input type="number" id="credits" name="credits" min="1" max="10" value="3" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn">Add Course</button>
                        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="table-header-area">
                    <h2>Course Catalog</h2>
                </div>
                <table id="courses-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Enrolled</th>
                            <th>Faculty</th>
                            <th style="width: 180px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courses-tbody">
                    </tbody>
                </table>
                <p id="no-courses" class="hidden">No courses found. Define one above!</p>
            </div>
        </div>
    </main>

    <script src="js/course.js"></script>
</body>
</html>
